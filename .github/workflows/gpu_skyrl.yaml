name: SkyRL-GPU

on:
  push:
    branches: [ main ]
    paths:
      - 'ci/**'
      - 'skyrl/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/gpu_skyrl.yaml'
  pull_request:
    paths:
      - 'ci/**'
      - 'skyrl/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/gpu_skyrl.yaml'
  workflow_dispatch:

permissions:
  checks: write
  contents: read

concurrency:
  group: skyrl-gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skyrl_gpu_tests:
    runs-on: ubuntu-latest
    env:
      ANYSCALE_CLI_TOKEN: ${{ secrets.ANYSCALE_CLI_TOKEN }}
      ANYSCALE_HOST: https://console.anyscale.com
    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          activate-environment: true
      - name: Check Anyscale credentials
        id: anyscale_credentials
        run: |
          if [[ -n "${ANYSCALE_CLI_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Skipping GPU tests because ANYSCALE_CLI_TOKEN is not configured."
          fi
      - name: Install dependencies
        run: uv pip install anyscale==0.26.103 typer==0.9.0
      - name: GPU tests
        if: steps.anyscale_credentials.outputs.available == 'true'
        run: |
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          JOB_NAME="skyrl-tx-gpu-ci-${COMMIT_SHA:0:7}-${{ github.run_id }}"
          anyscale job submit -f ci/anyscale_gpu_ci.yaml --name "$JOB_NAME" --timeout 10000
          anyscale job wait --cloud sky-anyscale-aws-us-east-1 --name "$JOB_NAME" --timeout 10000
