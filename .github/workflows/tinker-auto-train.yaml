name: tinker-auto-train

# Mirror of auto-train.yaml but driving the Tinker entrypoint
# (integrations.fleet.entrypoints.main_fleet_tinker) instead of `sky launch`.
# Tinker runs in Tinker cloud, so the runner needs no GPU and no SkyPilot.
#
# Per-pair pipeline (per (dataset, modality) discovered from Supabase):
#   discovery → smoke → S3 export → 90/10 split → Tinker LoRA training →
#   pre/post held-out eval → eval_results JSON artifact + Slack post.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no S3 writes, no Tinker run)"
        required: false
        default: "false"
      skip_smoke:
        description: "Skip env smoke test"
        required: false
        default: "false"
      team_id:
        description: "Filter datasets by team_id. Blank = all teams."
        required: false
        default: ""
      max_datasets:
        description: "Cap number of datasets processed this run (newest-first). 0 = unlimited."
        required: false
        default: "1"
      ignore_seed:
        description: "Treat all matching datasets as candidates (bypass seen/processed filters). For targeted testing."
        required: false
        default: "false"
      modality:
        description: "Filter to one modality (tool_use / browser_use / computer_use). Leave blank for all."
        required: false
        default: ""
      base_model:
        description: "Tinker base model (HF id). Defaults to moonshotai/Kimi-K2.6."
        required: false
        default: "moonshotai/Kimi-K2.6"
      num_steps:
        description: "Training step budget per (dataset, modality)."
        required: false
        default: "50"
      lora_rank:
        description: "LoRA rank."
        required: false
        default: "16"

permissions:
  contents: read

concurrency:
  group: tinker-auto-train
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Minimal set for the Tinker pipeline: auto_train modules + the Tinker
        # entrypoint (tinker SDK, torch CPU wheel, datasets, fleet-python).
        # No SkyPilot, no flash-attn, no vLLM — the runner orchestrates API
        # calls; training compute lives in Tinker cloud.
        #
        # `skyrl-gym` is installed editable because main_fleet_tinker imports
        # `FleetTaskEnv` from it. The root `skyrl.*` namespace is needed for
        # `skyrl.train.generators.utils.apply_overlong_filtering`.
        run: |
          python -m pip install --upgrade pip
          pip install \
            "boto3>=1.34" \
            "botocore>=1.34" \
            "httpx>=0.27" \
            "fleet-python<=0.2.119" \
            "datasets>=2.20" \
            "transformers>=4.45" \
            "torch>=2.5" \
            "tqdm" \
            "wandb" \
            "tinker" \
            "omegaconf" \
            "loguru" \
            "openenv"
          pip install -e ./skyrl-gym
          pip install -e .

      - name: Preflight (Tinker-only)
        env:
          FLEET_API_KEY: ${{ secrets.FLEET_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          bash scripts/fleet-preflight.sh \
            --require TINKER_API_KEY \
            --skip-gcloud \
            --skip-sky \
            --skip-wandb

      - name: Run Tinker auto-train trigger
        env:
          FLEET_API_KEY: ${{ secrets.FLEET_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          TINKER_API_KEY: ${{ secrets.TINKER_API_KEY }}
          TINKER_API_URL: ${{ secrets.TINKER_API_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Override SLACK_TINKER_AUTO_TRAIN_CHANNEL to keep Tinker pipeline
          # notifications separable from the SkyPilot pipeline channel.
          SLACK_AUTO_TRAIN_CHANNEL: "#fleet-training-runs"
          SLACK_TINKER_AUTO_TRAIN_CHANNEL: "#fleet-tinker-runs"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.skip_smoke }}" = "true" ]; then
            ARGS="$ARGS --skip-smoke"
          fi
          if [ "${{ github.event.inputs.ignore_seed }}" = "true" ]; then
            ARGS="$ARGS --ignore-seed"
          fi
          if [ -n "${{ github.event.inputs.team_id }}" ]; then
            ARGS="$ARGS --team-id ${{ github.event.inputs.team_id }}"
          fi
          if [ -n "${{ github.event.inputs.modality }}" ]; then
            ARGS="$ARGS --modality ${{ github.event.inputs.modality }}"
          fi
          MAX_D="${{ github.event.inputs.max_datasets }}"
          if [ -n "$MAX_D" ] && [ "$MAX_D" != "0" ]; then
            ARGS="$ARGS --max-datasets $MAX_D"
          fi
          BASE_MODEL="${{ github.event.inputs.base_model }}"
          if [ -n "$BASE_MODEL" ]; then
            ARGS="$ARGS --tinker-base-model $BASE_MODEL"
          fi
          NUM_STEPS="${{ github.event.inputs.num_steps }}"
          if [ -n "$NUM_STEPS" ]; then
            ARGS="$ARGS --tinker-num-steps $NUM_STEPS"
          fi
          LORA_RANK="${{ github.event.inputs.lora_rank }}"
          if [ -n "$LORA_RANK" ]; then
            ARGS="$ARGS --tinker-lora-rank $LORA_RANK"
          fi
          python -m integrations.fleet.auto_train --backend tinker trigger $ARGS

      - name: Print state on completion
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: python -m integrations.fleet.auto_train --backend tinker status || true

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinker-eval-results-${{ github.run_id }}
          path: eval_results/*.json
          if-no-files-found: ignore
          retention-days: 30
