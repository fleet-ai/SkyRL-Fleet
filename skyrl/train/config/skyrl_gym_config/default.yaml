# @package environment.skyrl_gym
# number of background workers for env step calls. Set to 0 to disable background workers.
max_env_workers: 32

text2sql:
  db_path: "/home/ray/default/sql_data"

llm_as_a_judge:
  model: "gpt-4o-mini"
  base_url: null  # or a local endpoint: http://localhost:8000/v1

search:
  log_requests: false
  search_url: "http://127.0.0.1:8000/retrieve"
  topk: 3
  timeout: 30

fleet_task:
  tasks_file: null
  api_key: null
  ttl_seconds: 900
  partial_reward: false
  enable_hints: false
  hint_reward_threshold: 0.0
  n_hint_samples: 2
  enable_context_tools: false
  use_llm_hints: false
  hint_model: "openrouter/anthropic/claude-sonnet-4"
  hint_llm_timeout: 30.0

task_gen:
  max_turns: 10
  judge_model: "anthropic/claude-sonnet-4.5"
  evaluator_model: "anthropic/claude-sonnet-4.5"
  base_quality_reward: 0.0
  k_rollouts: 4
  eval_k_rollouts: 8
  alpha: 1.0
  max_eval_steps: 20

negotiation:
  reward_mode: "outcome"          # "outcome" | "outcome_pareto"
  pareto_coef: 0.5                # weight on the Pareto bonus when reward_mode == "outcome_pareto"
  protocol: "single"             # "single" (one proposer + <accept>) | "dual" (both emit <deal>)
  opponent_model: "openrouter/openai/gpt-4o-mini"  # litellm model string for the env-played opponent ("them")
  opponent_base_url: null         # optional OpenAI-compatible base_url override (e.g. a local policy server)
  opponent_temperature: 0.7
  opponent_max_tokens: 512
  opponent_timeout: 60.0          # per-call timeout (seconds) for the opponent LLM
  opponent_no_think: true         # append /no_think to the opponent system prompt (hybrid-reasoning models)
  opponent_max_retries: 2
  invalid_penalty: 0.0            # reward penalty for a malformed/failed final action (kept 0 by default)
  deception_penalty: 0.0          # per-message penalty when prose promises an item to the opponent but the <propose> JSON keeps all of it (0 disables)
