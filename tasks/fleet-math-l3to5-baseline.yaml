# MATH levels 3-5 GRPO baseline (Qwen2.5-7B-Instruct) on the multi-node Fleet infra.
#
# Text-only RL baseline (env_class=aime, Hendrycks-MATH grader) used to validate the
# multi-node Fleet training stack independently of the agentic browser/tool backend.
# Routes through scripts/fleet-math-run.sh -> scripts/fleet-common-run.sh (Ray multi-node,
# NCCL/IB intersection, FSDP2 colocate placement) like the 35B VL run.
#
# Launch (reserved Slurm cluster):
#   bash scripts/fleet-launch.sh --skip-gcloud --keep-cluster -- \
#     tasks/fleet-math-l3to5-baseline.yaml \
#     --env WANDB_API_KEY=... --env FLEET_API_KEY=... \
#     --env AWS_ACCESS_KEY_ID=... --env AWS_SECRET_ACCESS_KEY=... \
#     --retry-until-up -y

name: fleet-math-l3to5-baseline

resources:
  disk_size: 750
  memory: 1500+
  ordered:
    - accelerators: H200:8
      cloud: slurm
      region: runpod-cluster-y8puzql3juawue

num_nodes: 4

workdir:
  url: https://github.com/fleet-ai/SkyRL-Fleet.git
  ref: agu/vf

envs:
  WANDB_API_KEY: ""
  FLEET_API_KEY: ""          # required by fleet-common-setup.sh env validation (unused by the aime math env)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  S3_DATASET_BUCKET: "fleet-internal-datasets"
  DATA_VERSION: "v7"
  # MODALITY is a fleet-common-setup.sh validation knob (must be tool_use/computer_use/
  # browser_use). This is a NON-fleet (math) run, so it is a placeholder only — the small
  # browser_use task json it downloads is unused, and --skip-prepare skips fleet dataset
  # prep. fleet-math-run.sh prepares the MATH parquet itself and forces its own data dir.
  MODALITY: "browser_use"
  MODEL_PATH: "Qwen/Qwen2.5-7B-Instruct"
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"

setup: |
  bash scripts/fleet-common-setup.sh \
    --skip-prepare \
    --openenv-branch deniz/fleet_client \
    --extra-setup scripts/fleet-qwen35-extra-setup.sh

run: |
  bash scripts/fleet-math-run.sh
