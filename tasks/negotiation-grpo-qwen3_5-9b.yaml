# Negotiation RLVR GRPO Training via SkyPilot — Qwen3.5-9B (2-node)
#
# Usage:
#   bash scripts/fleet-launch.sh --skip-fleet --skip-aws --require OPENROUTER_API_KEY -- \
#     tasks/negotiation-grpo-qwen3_5-9b.yaml \
#     --env WANDB_API_KEY="$WANDB_API_KEY" --env OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
#   (add --skip-gcloud to the preflight args if you are NOT launching on GCP.)
#
# Negotiation is text-only and self-contained: NO Fleet API key, NO AWS, and NO
# S3 dataset are needed. The opponent ("them") side is an OpenRouter LLM and the
# dataset is generated on the head node by the run script (prepare_dataset.py).
# AWS_* are optional and only used for S3 checkpoint upload.
#
# Reward ablation arms (set before launch via --env REWARD_MODE=...):
#   outcome        (default) — pure normalized self-score
#   outcome_pareto           — self-score + PARETO_COEF * Pareto bonus
#
# Qwen3.5-9B: GDN MoE, ~1B active. Fits on one H200 (TP=1). 2 nodes x 8 H200 =
# 16 GPUs -> 16 inference engines. Thinking is OFF (short turn-budgeted task).

name: negotiation-grpo-qwen3-5-9b

resources:
  disk_size: 500
  memory: 800+
  ordered:
    # RunPod Slurm cluster (reserved H200s, no preemption)
    - accelerators: H200:8
      cloud: slurm
      region: runpod-cluster-y8puzql3juawue
    # RunPod on-demand (API provisioned)
    - accelerators: H200-SXM:8
      cloud: runpod
      ports: 6479
    # GKE fallback
    - accelerators: H200:8
      cloud: kubernetes
      network_tier: best
      use_spot: true
      ports: 6479
    # GCP fallback
    - accelerators: H200:8
      cloud: gcp
      use_spot: true
      ports: 6479
      image_id: projects/deeplearning-platform-release/global/images/common-cu128-ubuntu-2204-nvidia-570-v20260305
    # Other providers
    - accelerators: H200:8
      cloud: lambda
      ports: 6479

num_nodes: 2

# Upload the local working directory (your current branch), so the negotiation
# env code + scripts are shipped as-is without needing them merged to main.
workdir: .

envs:
  WANDB_API_KEY: ""
  OPENROUTER_API_KEY: ""
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"
  MODEL_PATH: "Qwen/Qwen3.5-9B"
  MODEL_TAG: "qwen35"
  MODALITY: "negotiation"
  # --- Negotiation task knobs ---
  NEGOTIATION_DATASET: "dnd"        # dnd carries the training signal; casino saturates
  NEGOTIATION_PROTOCOL: "single"    # single (propose/accept) | dual (both submit <deal>)
  REWARD_MODE: "outcome"            # outcome | outcome_pareto  (the ablation knob)
  PARETO_COEF: "0.5"
  OPPONENT_MODEL: "openrouter/openai/gpt-4o-mini"
  MAX_TURNS: 6
  MAX_INPUT_LENGTH: 8192
  MAX_GENERATE_LENGTH: 1024
  NUM_EPOCHS: 20
  RUN_ID: ""
  RESUME_RUN_NAME: ""
  # 2 nodes x 8 H200 = 16 GPUs; TP=1 -> 16 engines.
  NUM_INFERENCE_ENGINES: 16
  # Optional: only used for S3 checkpoint upload (safe to leave blank).
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  S3_CHECKPOINT_BUCKET: "skyrl-checkpoints"
  S3_TRAJECTORY_BUCKET: "skyrl-trajectories"

setup: |
  bash scripts/fleet-negotiation-setup.sh \
    --extra-setup scripts/fleet-qwen35-extra-setup.sh

run: |
  bash scripts/fleet-negotiation-9b-run.sh
