# Negotiation RLVR GRPO Training via SkyPilot — Qwen3.5-35B-A3B (1-node)
#
# 1 node x 8 H200 = 8 GPUs; TP=2 -> 4 inference engines.
# Training uses FSDP2 across all 8 GPUs (shard=full, no TP in trainer).
#
# Reward ablation arms (set before launch via --env REWARD_MODE=...):
#   outcome        (default) — pure normalized self-score
#   outcome_pareto           — self-score + PARETO_COEF * Pareto bonus

name: negotiation-grpo-qwen3-5-35b

resources:
  disk_size: 1000
  memory: 800+
  ordered:
    # RunPod Slurm cluster (reserved H200s, no preemption)
    - accelerators: H200:8
      cloud: slurm
      region: runpod-cluster-y8puzql3juawue
    # RunPod on-demand (API provisioned)
    - accelerators: H200-SXM:8
      cloud: runpod
      ports: 6479
    # GKE fallback
    - accelerators: H200:8
      cloud: kubernetes
      network_tier: best
      use_spot: true
      ports: 6479
    # GCP fallback
    - accelerators: H200:8
      cloud: gcp
      use_spot: true
      ports: 6479
      image_id: projects/deeplearning-platform-release/global/images/common-cu128-ubuntu-2204-nvidia-570-v20260305
    # Other providers
    - accelerators: H200:8
      cloud: lambda
      ports: 6479

num_nodes: 1

workdir: .

envs:
  WANDB_API_KEY: ""
  OPENROUTER_API_KEY: ""
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"
  MODEL_PATH: "Qwen/Qwen3.5-35B-A3B"
  MODEL_TAG: "qwen35"
  MODALITY: "negotiation"
  # --- Negotiation task knobs ---
  NEGOTIATION_DATASET: "dnd"
  NEGOTIATION_PROTOCOL: "single"
  REWARD_MODE: "outcome"            # outcome | outcome_pareto  (the ablation knob)
  PARETO_COEF: "0.5"
  OPPONENT_MODEL: "openrouter/openai/gpt-4o-mini"
  MAX_TURNS: 6
  MAX_INPUT_LENGTH: 8192
  MAX_GENERATE_LENGTH: 1024
  NUM_EPOCHS: 20
  RUN_ID: ""
  RESUME_RUN_NAME: ""
  # 1 node x 8 H200; TP=2 -> 4 inference engines.
  NUM_INFERENCE_ENGINES: 4
  # Optional: only used for S3 checkpoint upload (safe to leave blank).
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  S3_CHECKPOINT_BUCKET: "skyrl-checkpoints"
  S3_TRAJECTORY_BUCKET: "skyrl-trajectories"

setup: |
  bash scripts/fleet-negotiation-setup.sh \
    --extra-setup scripts/fleet-qwen35-extra-setup.sh

run: |
  bash scripts/fleet-negotiation-35b-run.sh
