name: narc-slurm
# Usage:
#   set -a; source ~/.secrets/research-jobs.env; set +a
#   sky launch tasks/narc-slurm.yaml \
#     --env AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
#     --env AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
#
# Override NARC_OUT_DIR to change the result prefix. It may be a local path or
# an S3 prefix.

resources:
  disk_size: 100
  accelerators: H200:8
  cloud: slurm
  region: runpod-cluster-y8puzql3juawue

num_nodes: 1

workdir: .

envs:
  NARC_OUT_DIR: "s3://fleet-research/narc"
  NARC_PROFILE: "correctness"
  NARC_TASKS: "8"

setup: |
  if ! command -v uv >/dev/null 2>&1; then
    python -m pip install --user uv
    export PATH="$HOME/.local/bin:$PATH"
  fi
  uv --version
  uv sync --project tools/narc --locked

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  JOB_ID="${SLURM_JOB_ID:-manual-$(date +%s)}"
  OUT_DIR="${NARC_OUT_DIR%/}/${JOB_ID}"
  AGGREGATE_OUTFILE="${NARC_AGGREGATE_OUTFILE:-${OUT_DIR%/}/aggregate.json}"
  EXPECTED_RESULTS="${NARC_EXPECTED_RESULTS:-${NARC_TASKS}}"
  export OUT_DIR NARC_PROFILE
  if [[ "${OUT_DIR}" != s3://* ]]; then
    mkdir -p "${OUT_DIR}"
  fi

  set +e
  srun --ntasks-per-node="${NARC_TASKS}" --gpus-per-task=1 --gpu-bind=single:1 \
    bash -c '
      set -euo pipefail
      logical_device=0
      visible="${CUDA_VISIBLE_DEVICES:-${NVIDIA_VISIBLE_DEVICES:-}}"
      if [ -n "${visible}" ] && [ "${visible}" != "all" ]; then
        IFS="," read -r -a visible_devices <<< "${visible}"
        if [ "${#visible_devices[@]}" -gt 1 ]; then
          logical_device="${SLURM_LOCALID:-0}"
        fi
      else
        logical_device="${SLURM_LOCALID:-0}"
      fi
      echo "narc rank=${SLURM_PROCID:-unknown} local_rank=${SLURM_LOCALID:-unknown} visible_gpus=${visible:-unset} logical_device=${logical_device}" >&2
      uv run --project tools/narc --no-sync narc run \
        --profile "${NARC_PROFILE}" \
        --device cuda \
        --logical-device "${logical_device}" \
        --dtype fp32 \
        --out-dir "${OUT_DIR}"
    '
  SRUN_EXIT=$?

  uv run --project tools/narc --no-sync narc aggregate "${OUT_DIR}" \
    --expected-results "${EXPECTED_RESULTS}" \
    --fail-on-fail \
    -o "${AGGREGATE_OUTFILE}"
  AGGREGATE_EXIT=$?
  set -e

  if [ "${SRUN_EXIT}" -ne 0 ] || [ "${AGGREGATE_EXIT}" -ne 0 ]; then
    echo "narc failed: srun_exit=${SRUN_EXIT} aggregate_exit=${AGGREGATE_EXIT}" >&2
    exit 1
  fi
