# PrimitivBench mini-flywheel: GRPO arms B / C on the CURRENT witness stack (v5b7-phase2).
#
# Reuses fleet-witness-setup.sh + fleet-witness-run.sh wholesale (ORAI witness_agent env
# for witness rows, R-series reward stack, spot-resume, S3 ckpt mirror + shard assert).
# The only additions: PB portfolio dataset prep + merge in setup, and three trailing
# Hydra overrides in run (train_data / val_data / trainer.seed) which win via "$@".
# Witness rows in the mixed parquet replicate arm A exactly (env_class=witness_agent);
# PB rows carry env_class=primitivbench → PrimitivBenchEnv (generic text harness).
#
# ARM A (baseline): reuse the existing 9B R5_pre run (wandb mtezmmq0) — do NOT retrain.
# This YAML's defaults mirror that run's documented 9B config; BEFORE LAUNCH, diff the
# envs below against mtezmmq0's wandb config and align any drift (LR/KL/entropy esp.).
#
# Usage (arm B, then arm C with the SAME TRAIN_SEED — paired-seed design, D-15):
#   cd SkyRL-Fleet
#   sky launch tasks/primitivbench-grpo.yaml \
#     --env PB_ARM=B --env RUN_LABEL=pb_armB_s42 \
#     --env WANDB_API_KEY=... --env OPENROUTER_API_KEY=... \
#     --env AWS_ACCESS_KEY_ID=... --env AWS_SECRET_ACCESS_KEY=... \
#     -y
#   ... then: --env PB_ARM=C --env RUN_LABEL=pb_armC_s42   (same TRAIN_SEED)
#
# Headline = Δ(B−C). Δ(B−A) descriptive only (quantity confound; criterion repo
# reports/2026-06-10_growth-score-precedents-and-validity.md fatal-2).
# Game split: witness-8 train + tw01/09/10/12 val = matches the pre-registered held-out.

resources:
  disk_size: 750
  ports: 6479
  any_of:
    - accelerators: H200:8
      cloud: gcp
      use_spot: true
      image_id: projects/deeplearning-platform-release/global/images/common-cu128-ubuntu-2204-nvidia-570-v20260305
    - accelerators: H200:8
      cloud: runpod
    - accelerators: H200:8
      cloud: lambda
    - accelerators: H200:8
      cloud: nebius
    - accelerators: H200-SXM:8
      cloud: vast

num_nodes: 1

# DEV-LOOP: rsync this local checkout (no git push needed). For the canonical/reproducible
# run, switch to the git-url form and pin the ref:
#   url: https://github.com/fleet-ai/SkyRL-Fleet.git
#   ref: guanghan/b7-phase2-judge-rewards
workdir: ~/Documents/obsidian/research-repos/SkyRL-Fleet

file_mounts:
  ~/arc-witness-agent: ~/Documents/obsidian/research-directions/repos/arc-witness-agent
  ~/arc-witness-envs: ~/Documents/obsidian/research-directions/repos/arc-witness-envs

envs:
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"
  SMOKE_ONLY: "0"

  # === PrimitivBench arm selection (D-15 three-arm protocol) ===
  PB_ARM: "B"                        # B = top-12 portfolio | C = placebo-12 active control
  TRAIN_SEED: "42"                   # keep IDENTICAL across arms B and C (paired seeds)
  PB_SEEDS_PER_GAME: "64"
  PB_MAX_TURNS: "30"

  # === Run identity / model (match arm A = 9B R5_pre / mtezmmq0) ===
  RUN_LABEL: "pb_armB_s42"           # set pb_armC_s42 for arm C (isolates ckpt/S3/wandb)
  MODEL: "Qwen/Qwen3.5-9B"
  # Arm A started from the witness SFT-v5 merged checkpoint — arms B/C must match.
  POLICY_CHECKPOINT_S3: "s3://fleet-guanghan/witness_sft_v5/merged/"

  # === Anti-collapse hyperparameters (9B values; VERIFY against mtezmmq0 wandb config) ===
  LR: "2.0e-6"
  NUM_EPOCHS: 100
  KL_LOSS_COEF: "0.005"
  ENTROPY_LOSS_COEF: "0.005"

  # === Batching (9B R5) ===
  TRAIN_BATCH_SIZE: 4
  POLICY_MINI_BATCH_SIZE: 4
  EVAL_BATCH_SIZE: 4
  EVAL_BEFORE_TRAIN: "true"
  EVAL_INTERVAL: 10
  N_SAMPLES_PER_PROMPT: 4
  EVAL_N_SAMPLES_PER_PROMPT: 3

  # === Checkpointing ===
  CKPT_INTERVAL: 20
  MAX_CKPTS_TO_KEEP: 3

  # === Generator capacity (9B R5) ===
  MAX_INPUT_LENGTH: 16384
  MAX_GENERATE_LENGTH: 1024
  MAX_PROMPT_LENGTH: 4096
  GPU_MEMORY_UTILIZATION: "0.8"
  INFERENCE_TENSOR_PARALLEL_SIZE: 1
  NUM_INFERENCE_ENGINES: 8

  # === R-series reward knobs — MUST MATCH ARM A (R5_pre: rubric ON, plan-div OFF, judge OFF) ===
  ENABLE_PLAN_DIVERSITY_PENALTY: "0"
  PLAN_DIVERSITY_SCHEME: "consecutive"
  PLAN_DIVERSITY_PENALTY: "-0.05"
  ENABLE_RULE_JUDGE_REWARD: "0"
  RULE_JUDGE_MODEL: "anthropic/claude-haiku-4.5"
  RULE_JUDGE_SAMPLE_RATE: "0.20"
  RULE_JUDGE_MAX_REWARD: "0.30"
  ENABLE_RUBRIC_REWARD: "1"
  RUBRIC_MODEL: "anthropic/claude-haiku-4.5"
  RUBRIC_SAMPLE_RATE: "0.15"
  RUBRIC_PER_ITEM_REWARD: "0.05"
  # R5 baseline used Sonnet 4.5 secondary (p2_r5_35b_opus uses Opus 4.8 — that is the
  # "surpass" run, not the baseline). Match whichever run is your arm A.
  ENABLE_SECONDARY_PROVIDER_FALLBACK: "1"
  SECONDARY_MODEL: "anthropic/claude-sonnet-4.5"
  SECONDARY_SKIP_PRIMARY: "1"
  OPENROUTER_API_KEY: ""
  OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
  USE_ENV_GROUND_TRUTH: "1"
  AGENT_MLLM_ENABLED: "0"

  # === Witness game split (same as arm A; val = pre-registered held-out) ===
  GAME_IDS: "tw03 tw06 tw02 tw05 tw08 tw11 tw13 tw07"
  VAL_GAME_IDS: "tw01 tw09 tw10 tw12"
  MAX_LEVELS: "5"
  MAX_ORAI_STEPS: "30"
  REWARD_MODE: "shaped"
  OBS_MODE: "grid"
  RULES_MODE: "rules_unknown"
  MAX_TURNS: "30"
  S3_TRAJECTORY_BUCKET: "fleet-guanghan"

  # Credentials (REQUIRED at launch — never commit values here)
  WANDB_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"

setup: |
  bash scripts/fleet-witness-setup.sh

  # --- PB additions (rank 0 only; workers were released by the witness sentinel) ---
  if [ "${SLURM_PROCID:-${SKYPILOT_NODE_RANK:-0}}" = "0" ]; then
    source .venv/bin/activate
    cd ~/sky_workdir

    if [ "$PB_ARM" = "B" ]; then
      PORTFOLIO=examples/train_integrations/primitivbench/portfolios/portfolio_v1.json
    else
      PORTFOLIO=examples/train_integrations/primitivbench/portfolios/portfolio_placebo_v1.json
    fi
    echo "[pb-setup] arm $PB_ARM ← $PORTFOLIO"

    # Games ship pre-vendored in the repo → vendoring is a no-op; emits pb parquet + merge.
    python examples/train_integrations/primitivbench/prepare_primitivbench_dataset.py \
      --portfolio "$PORTFOLIO" \
      --seeds-per-game "$PB_SEEDS_PER_GAME" \
      --max-turns "$PB_MAX_TURNS" \
      --output $HOME/data/primitivbench/pb_train.parquet \
      --val-output $HOME/data/primitivbench/pb_val.parquet \
      --merge-witness $HOME/data/witness_v5b7/train.parquet \
      --merged-output $HOME/data/primitivbench/arm${PB_ARM}_mixed.parquet

    # PB env smoke before burning GPU-hours on model load.
    python -c "from examples.train_integrations.primitivbench.env import PrimitivBenchEnv; e = PrimitivBenchEnv({}, {'game_name': 'PB-pilot-001__gemini-2.5-pro', 'seed': 1000}); chat, meta = e.init([]); out = e.step('<action>0</action>'); assert isinstance(out['reward'], float); print('[ok] PrimitivBenchEnv smoke:', meta['game_name'])"
  fi

run: |
  # Trailing Hydra overrides are appended after the witness baseline args ("$@") → they win.
  bash scripts/fleet-witness-run.sh \
    data.train_data="['$HOME/data/primitivbench/arm${PB_ARM}_mixed.parquet']" \
    data.val_data="['$HOME/data/witness_v5b7/validation.parquet','$HOME/data/primitivbench/pb_val.parquet']" \
    trainer.seed=${TRAIN_SEED}
