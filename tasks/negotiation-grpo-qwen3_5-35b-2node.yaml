# Negotiation RLVR GRPO Training via SkyPilot — Qwen3.5-35B-A3B (2-node)
#
# 2 nodes x 8 H200 = 16 GPUs; TP=2 -> 8 inference engines (4 per node).
# Training uses FSDP2 across all 16 GPUs.
#
# Reward ablation arms (set before launch via --env REWARD_MODE=...):
#   outcome        (default) — pure normalized self-score
#   outcome_pareto           — self-score + PARETO_COEF * Pareto bonus

name: negotiation-grpo-qwen3-5-35b-2node

resources:
  disk_size: 1000
  memory: 800+
  ordered:
    # RunPod Slurm cluster (reserved H200s, no preemption)
    - accelerators: H200:8
      cloud: slurm
      region: runpod-cluster-y8puzql3juawue
    # RunPod on-demand (API provisioned)
    - accelerators: H200-SXM:8
      cloud: runpod
      ports: 6479
    # GKE fallback
    - accelerators: H200:8
      cloud: kubernetes
      network_tier: best
      use_spot: true
      ports: 6479
    # GCP fallback
    - accelerators: H200:8
      cloud: gcp
      use_spot: true
      ports: 6479
      image_id: projects/deeplearning-platform-release/global/images/common-cu128-ubuntu-2204-nvidia-570-v20260305

num_nodes: 2

workdir: .

envs:
  WANDB_API_KEY: ""
  OPENROUTER_API_KEY: ""
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"
  MODEL_PATH: "Qwen/Qwen3.5-35B-A3B"
  MODEL_TAG: "qwen35"
  MODALITY: "negotiation"
  # --- Negotiation task knobs ---
  NEGOTIATION_DATASET: "dnd"
  NEGOTIATION_PROTOCOL: "single"
  REWARD_MODE: "outcome"            # normalized self-score (you_norm = you_score/you_max)
  PARETO_COEF: "0.5"
  # Adversary swapped gpt-4o-mini -> gpt-5.5 for this baseline.
  OPPONENT_MODEL: "openrouter/openai/gpt-5.5"
  # Clean baseline: NO behavior-shaping penalties. Deception penalty OFF (0);
  # empty-think / value-leak are thinking-arm only (ENABLE_THINKING=false -> off).
  # The length penalty and the invalid/format penalty (-0.05) stay ON via the
  # run-script defaults (generator.length_penalty_* + invalid_penalty).
  DECEPTION_PENALTY: "0"
  ENABLE_THINKING: "false"          # set true to enable Qwen3.5 <think> blocks
  MAX_TURNS: 6
  # Held-out CaSiNo eval set (transfer check vs dnd memorization): number of casino
  # scenarios appended as a second eval set (36 = all unique; 0 disables).
  # Logged separately as eval/negotiation_casino/* vs eval/negotiation_dnd/*.
  CASINO_EVAL: "36"
  MAX_INPUT_LENGTH: 8192
  MAX_GENERATE_LENGTH: 8192
  NUM_EPOCHS: 20
  RUN_ID: ""
  RESUME_RUN_NAME: ""
  # 2 nodes x 8 H200; TP=2 -> 8 inference engines (4 per node).
  NUM_INFERENCE_ENGINES: 8
  # Optional: only used for S3 checkpoint upload (safe to leave blank).
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  S3_CHECKPOINT_BUCKET: "skyrl-checkpoints"
  S3_TRAJECTORY_BUCKET: "skyrl-trajectories"

setup: |
  bash scripts/fleet-negotiation-setup.sh \
    --extra-setup scripts/fleet-qwen35-extra-setup.sh

run: |
  bash scripts/fleet-negotiation-35b-run.sh
