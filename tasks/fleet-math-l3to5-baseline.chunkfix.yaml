# TEMP one-off copy of fleet-math-l3to5-baseline.yaml used to UNBLOCK a crashed run.
#
# Identical to the canonical task EXCEPT the run command injects the missing
# `trainer.loss_chunk_size=4096` hydra override (forwarded through fleet-math-run.sh's
# trailing "$@" -> fleet-common-run.sh HYDRA_OVERRIDES). The canonical fleet-math-run.sh
# is the ONLY fleet run script that omits loss_chunk_size, so it defaults to null and
# `model_wrapper.py:388  use_chunked = self.loss_chunk_size > 0` raises
# `TypeError: '>' not supported between instances of 'NoneType' and 'int'` at the first
# training forward. Permanent fix = add the flag to scripts/fleet-math-run.sh and push to
# the agu/vf branch (per CLAUDE.md "all training flags live in these scripts"); this yaml
# is a stopgap that needs no git push.

name: fleet-math-l3to5-baseline

resources:
  disk_size: 750
  memory: 1500+
  ordered:
    - accelerators: H200:8
      cloud: slurm
      region: runpod-cluster-y8puzql3juawue

num_nodes: 4

workdir:
  url: https://github.com/fleet-ai/SkyRL-Fleet.git
  ref: agu/vf

envs:
  WANDB_API_KEY: ""
  FLEET_API_KEY: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  S3_DATASET_BUCKET: "fleet-internal-datasets"
  DATA_VERSION: "v7"
  MODALITY: "browser_use"
  MODEL_PATH: "Qwen/Qwen2.5-7B-Instruct"
  LOGGER: "wandb"
  INFERENCE_BACKEND: "vllm"

setup: |
  bash scripts/fleet-common-setup.sh \
    --skip-prepare \
    --openenv-branch deniz/fleet_client \
    --extra-setup scripts/fleet-qwen35-extra-setup.sh

run: |
  bash scripts/fleet-math-run.sh trainer.loss_chunk_size=4096 trainer.ckpt_interval=50
