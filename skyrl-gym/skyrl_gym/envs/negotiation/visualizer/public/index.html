<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Deal or No Deal — Negotiation Dataset Visualizer</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <h1>Negotiation&nbsp;Datasets</h1>
      <span class="subtitle" id="datasetBlurb">Multi-issue bargaining corpora · RLVR exploration</span>
    </div>
    <div class="selectors">
      <div class="mode-tabs" id="modeTabs">
        <button class="tab active" data-mode="data">Human dialogues</button>
        <button class="tab" data-mode="eval">Model eval</button>
      </div>
      <div class="dataset-tabs" id="datasetTabs"></div>
      <div class="eval-filters" id="evalFilters" style="display:none">
        <label>Model<select id="evalModel"></select></label>
        <label>Game<select id="evalDataset"></select></label>
        <label>Protocol<select id="evalProto"></select></label>
      </div>
      <div class="split-tabs" id="splitTabs"></div>
    </div>
  </header>

  <section class="stats-grid" id="statsGrid"></section>

  <section class="charts">
    <div class="chart-card"><h3>Dialogue length (turns)</h3><canvas id="turnsChart"></canvas></div>
    <div class="chart-card"><h3 id="scoreChartTitle">Score distribution (per agent, agreed deals)</h3><canvas id="scoreChart"></canvas></div>
    <div class="chart-card small"><h3>Outcomes</h3><canvas id="outcomeChart"></canvas></div>
  </section>

  <section class="controls">
    <input type="search" id="searchBox" placeholder="Search dialogue text…" />
    <select id="outcomeFilter">
      <option value="all">All outcomes</option>
      <option value="agreed">Agreement only</option>
      <option value="disagreed">No agreement</option>
    </select>
    <select id="sortBy">
      <option value="default">Sort: default</option>
      <option value="turns_desc">Most turns</option>
      <option value="turns_asc">Fewest turns</option>
      <option value="joint_desc">Highest joint score</option>
      <option value="gap_desc">Most lopsided</option>
    </select>
    <span class="count" id="resultCount"></span>
  </section>

  <section class="game-list" id="gameList"></section>
  <div class="pager" id="pager"></div>
</div>

<script src="app.js"></script>
</body>
</html>
